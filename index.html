<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card Shop Stream</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }

  .layout {
    display: flex;
    height: 100%;
    width: 100%;
  }

  /* LEFT: Item Feed (1/3) */
  .feed-panel {
    width: 33.333%;
    height: 100%;
    background: transparent;
    position: relative;
  }

  .info-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.85);
    color: white;
    font-size: 13px;
    font-weight: bold;
    padding: 6px 12px;
    text-align: center;
    letter-spacing: 0.5px;
    z-index: 10;
  }

  .ticker-wrap {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    color: white;
    overflow: hidden;
    padding-top: 32px;
  }

  .ticker {
    display: flex;
    flex-direction: column;
    animation: scroll 300s linear infinite;
    width: 100%;
  }

  .item {
    padding: 8px 16px;
    font-size: 11px;
    font-weight: bold;
    white-space: normal;
    word-break: break-word;
    overflow-wrap: anywhere;
    width: 100%;
  }
  .item span.price { color: #4ade80; margin-left: 8px; }
  .item span.soldout-price { color: #ef4444; margin-left: 8px; text-decoration: line-through; }
  .item span.soldout { color: #ef4444; margin-left: 4px; text-transform: uppercase; }

  @keyframes scroll {
    0% { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }

  /* RIGHT: Shop Scene */
  .shop-panel {
    width: 66.667%;
    height: 100%;
    background: #f5e6c8;
    position: relative;
    overflow: hidden;
  }

  /* Beige tiled floor */
  .floor {
    position: absolute;
    inset: 0;
    background: 
      linear-gradient(#e0d0b0 1px, transparent 1px),
      linear-gradient(90deg, #e0d0b0 1px, transparent 1px),
      #f0e0c0;
    background-size: 48px 48px;
  }

  /* Walls */
  .wall-back {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 60px;
    background: #e8dcc8;
    border-bottom: 4px solid #d4c4a8;
  }
  .wall-left, .wall-right {
    position: absolute;
    top: 0; bottom: 0;
    width: 16px;
    background: #e8dcc8;
  }
  .wall-left { left: 0; }
  .wall-right { right: 0; }

  /* Left counter area */
  .counter-area {
    position: absolute;
    left: 20px;
    top: 70px;
    width: 220px;
    height: 160px;
    background: #4a4a4a;
    border: 3px solid #333;
  }
  .counter-top {
    position: absolute;
    left: 20px;
    top: 70px;
    width: 220px;
    height: 40px;
    background: #6a6a6a;
  }

  /* Big back wall display case */
  .wall-case {
    position: absolute;
    left: 280px;
    top: 50px;
    width: 420px;
    height: 110px;
    background: #2a2a2a;
    border: 4px solid #111;
    display: flex;
    flex-wrap: wrap;
    padding: 6px;
    gap: 4px;
    align-content: flex-start;
  }
  .wall-case .card {
    width: 28px;
    height: 36px;
    background: #ffcc66;
    border: 1px solid #000;
  }

  /* Center freestanding case */
  .center-case {
    position: absolute;
    left: 340px;
    top: 200px;
    width: 260px;
    height: 100px;
    background: #333;
    border: 3px solid #111;
    display: flex;
    flex-wrap: wrap;
    padding: 8px;
    gap: 4px;
  }
  .center-case .card {
    width: 26px;
    height: 34px;
    background: #88aaff;
    border: 1px solid #000;
  }

  /* Table + chairs */
  .table {
    position: absolute;
    left: 80px;
    top: 320px;
    width: 140px;
    height: 80px;
    background: #8b5e3c;
    border: 3px solid #6b4423;
  }
  .chair {
    position: absolute;
    width: 28px;
    height: 28px;
    background: #5a4030;
    border: 2px solid #3a2818;
  }
  .chair-1 { left: 90px; top: 290px; }
  .chair-2 { left: 140px; top: 290px; }
  .chair-3 { left: 90px; top: 400px; }
  .chair-4 { left: 140px; top: 400px; }

  /* Couch area */
  .couch {
    position: absolute;
    right: 40px;
    top: 340px;
    width: 160px;
    height: 50px;
    background: #d4c4a8;
    border: 3px solid #b8a888;
  }
  .tv-stand {
    position: absolute;
    right: 60px;
    top: 280px;
    width: 120px;
    height: 40px;
    background: #6a5a4a;
    border: 2px solid #4a3a2a;
  }
  .tv {
    position: absolute;
    right: 80px;
    top: 250px;
    width: 70px;
    height: 40px;
    background: #222;
    border: 2px solid #000;
  }

  /* Plants */
  .plant {
    position: absolute;
    width: 28px;
    height: 36px;
    background: #2d6a4f;
    border-radius: 4px 4px 0 0;
  }
  .plant::after {
    content: '';
    position: absolute;
    bottom: -5px; left: 4px; right: 4px;
    height: 7px;
    background: #8b5e3c;
  }
  .p1 { left: 30px; top: 40px; }
  .p2 { left: 240px; top: 80px; }
  .p3 { left: 50px; top: 450px; }
  .p4 { right: 50px; top: 400px; }
  .p5 { left: 300px; top: 180px; }
</style>
</head>
<body>
<div class="layout">
  <div class="feed-panel">
    <div class="info-bar" id="infoBar">Loading inventory...</div>
    <div class="ticker-wrap">
      <div class="ticker" id="ticker"></div>
    </div>
  </div>

  <div class="shop-panel">
    <div class="floor"></div>
    <div class="wall-back"></div>
    <div class="wall-left"></div>
    <div class="wall-right"></div>

    <div class="counter-area"></div>
    <div class="counter-top"></div>

    <div class="wall-case">
      <!-- cards generated by repeating divs -->
      <div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div>
      <div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div>
      <div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div>
    </div>

    <div class="center-case">
      <div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div>
      <div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div>
    </div>

    <div class="table"></div>
    <div class="chair chair-1"></div>
    <div class="chair chair-2"></div>
    <div class="chair chair-3"></div>
    <div class="chair chair-4"></div>

    <div class="couch"></div>
    <div class="tv-stand"></div>
    <div class="tv"></div>

    <div class="plant p1"></div>
    <div class="plant p2"></div>
    <div class="plant p3"></div>
    <div class="plant p4"></div>
    <div class="plant p5"></div>
  </div>
</div>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQC0oTQEVVzoNRYrTdZ4LU3yRZZCQugnVwj0_sUUJcUDw4l_DbncBWdWIWZxLvRT5b9j5l_9a0LfA2V/pub?gid=866828695&single=true&output=csv';

  function parseCSVRow(row) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < row.length; i++) {
      const char = row[i];
      const nextChar = row[i + 1];
      if (char === '"' && inQuotes && nextChar === '"') { current += '"'; i++; }
      else if (char === '"') { inQuotes = !inQuotes; }
      else if (char === ',' && !inQuotes) { result.push(current); current = ''; }
      else { current += char; }
    }
    result.push(current);
    return result;
  }

  function parsePrice(str) {
    if (!str) return 0;
    return parseFloat(str.replace(/[^0-9.]/g, '')) || 0;
  }

  async function loadProducts() {
    try {
      const res = await fetch(CSV_URL);
      const text = await res.text();
      const rows = text.trim().split('\n').slice(1);
      const ticker = document.getElementById('ticker');
      const infoBar = document.getElementById('infoBar');
      let html = '';
      let inStockCount = 0;
      let totalValue = 0;

      rows.forEach((row, index) => {
        const cols = parseCSVRow(row);
        const name = cols[2]?.trim() || '';
        const price = cols[7]?.trim() || '';
        const status = (cols[8]?.trim() || '').toLowerCase();
        const lineNumber = index + 2;
        if (!name) return;

        const isSoldOut = status === 'sold out';
        let extra = '';
        if (isSoldOut) {
          extra = `<span class="soldout-price">${price}</span><span class="soldout">sold out</span>`;
        } else {
          if (price) extra = `<span class="price">${price}</span>`;
          inStockCount++;
          totalValue += parsePrice(price);
        }
        html += `<div class="item">${lineNumber}. ${name}${extra}</div>`;
      });

      ticker.innerHTML = html + html;
      const formattedValue = totalValue.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
      infoBar.textContent = `${inStockCount} ITEMS - ${formattedValue} - CHAT !# TO BUY`;
    } catch (e) {
      document.getElementById('infoBar').textContent = 'Error loading inventory';
    }
  }

  loadProducts();
  setInterval(loadProducts, 120000);
</script>
</body>
</html>
