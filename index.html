<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Ticker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  .ticker-wrap {
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    color: white;
    overflow: hidden;
    position: relative;
  }
  .ticker {
    display: flex;
    flex-direction: column;
    animation: scroll 80s linear infinite;
  }
  .item {
    padding: 8px 16px;
    font-size: 11px;
    font-weight: bold;
    white-space: nowrap;
  }
  .item span.price {
    color: #4ade80;
    margin-left: 8px;
  }
  @keyframes scroll {
    0% { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }
</style>
</head>
<body>
<div class="ticker-wrap">
  <div class="ticker" id="ticker"></div>
</div>

<script>
  // PASTE YOUR PUBLISHED CSV URL HERE
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQC0oTQEVVzoNRYrTdZ4LU3yRZZCQugnVwj0_sUUJcUDw4l_DbncBWdWIWZxLvRT5b9j5l_9a0LfA2V/pub?gid=866828695&single=true&output=csv';

  async function loadProducts() {
    try {
      const res = await fetch(CSV_URL);
      const text = await res.text();
      const rows = text.trim().split('\n').slice(1); // skip header

      const ticker = document.getElementById('ticker');
      let html = '';

      rows.forEach(row => {
        const cols = row.split(',');
        const name = cols[0]?.replace(/"/g, '').trim() || '';
        const price = cols[1]?.replace(/"/g, '').trim() || '';
        if (name) {
          html += `<div class="item">${name}${price ? `<span class="price">${price}</span>` : ''}</div>`;
        }
      });

      // Duplicate for seamless loop
      ticker.innerHTML = html + html;
    } catch (e) {
      document.getElementById('ticker').innerHTML = '<div class="item">Error loading products</div>';
    }
  }

  loadProducts();
  // Refresh every 2 minutes
  setInterval(loadProducts, 120000);
</script>
</body>
</html>
Changes made:
Font size set to 11px
Scroll speed slowed to 80 seconds (increase the number further if you want it even slower)
Still displays card name (column 1) + price (column 2)
If your sheet columns are in a different order or have specific headers, tell me and I’ll adjust the parsing.
