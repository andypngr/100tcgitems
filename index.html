<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card Shop Stream</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }

  .layout {
    display: flex;
    height: 100%;
    width: 100%;
  }

  .feed-panel {
    width: 33.333%;
    height: 100%;
    background: transparent;
    position: relative;
  }

  .info-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.85);
    color: white;
    font-size: 13px;
    font-weight: bold;
    padding: 6px 12px;
    text-align: center;
    letter-spacing: 0.5px;
    z-index: 10;
  }

  .ticker-wrap {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    overflow: hidden;
    padding-top: 32px;
  }

  .ticker {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    padding: 32px;
    animation: scroll 792s linear infinite;
    width: 100%;
  }

  .card-item {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    background: #222;
  }

  .card-item img {
    width: 100%;
    aspect-ratio: 3.16 / 5.34;
    object-fit: cover;
    display: block;
  }

  .card-meta {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0, 0, 0, 0.75);
    color: white;
    font-size: 16px;
    font-weight: bold;
    padding: 6px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-meta .price { color: #4ade80; }
  .card-meta .soldout-price { color: #ef4444; text-decoration: line-through; }
  .card-meta .soldout { color: #ef4444; margin-left: 4px; text-transform: uppercase; }

  @keyframes scroll {
    0% { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }

  .shop-panel {
    width: 66.667%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: #a28f81;
  }

  .shop-layer {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: auto;
    object-fit: contain;
    pointer-events: none;
  }

  #shop-base { z-index: 1; }
  #shop-character { z-index: 2; }
  #shop-counter { z-index: 3; }
</style>
</head>
<body>
<div class="layout">
  <div class="feed-panel">
    <div class="info-bar" id="infoBar">Loading inventory...</div>
    <div class="ticker-wrap">
      <div class="ticker" id="ticker"></div>
    </div>
  </div>

  <div class="shop-panel">
    <img id="shop-base" class="shop-layer" src="imgs/cardshop1.jpg" alt="shop">
    <img id="shop-character" class="shop-layer" src="imgs/character_main1.png" alt="character">
    <img id="shop-counter" class="shop-layer" src="imgs/counter.png" alt="counter">
  </div>
</div>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQC0oTQEVVzoNRYrTdZ4LU3yRZZCQugnVwj0_sUUJcUDw4l_DbncBWdWIWZxLvRT5b9j5l_9a0LfA2V/pub?gid=866828695&single=true&output=csv';
  const WORKER_URL = 'https://ebay-image-proxy.andypeninger.workers.dev';

  const EBAY_ITEM_ID_COLUMN = 6;

  const shopBases = ['imgs/cardshop1.jpg', 'imgs/cardshop2.jpg', 'imgs/cardshop3.jpg'];
  const characterMains = ['imgs/character_main1.png', 'imgs/character_main2.png'];
  let baseIndex = 0;
  let charIndex = 0;

  setInterval(() => {
    baseIndex = (baseIndex + 1) % shopBases.length;
    document.getElementById('shop-base').src = shopBases[baseIndex];
  }, 400);

  setInterval(() => {
    charIndex = (charIndex + 1) % characterMains.length;
    document.getElementById('shop-character').src = characterMains[charIndex];
  }, 500);

  function parseCSVRow(row) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < row.length; i++) {
      const char = row[i];
      const nextChar = row[i + 1];
      if (char === '"' && inQuotes && nextChar === '"') { current += '"'; i++; }
      else if (char === '"') { inQuotes = !inQuotes; }
      else if (char === ',' && !inQuotes) { result.push(current); current = ''; }
      else { current += char; }
    }
    result.push(current);
    return result;
  }

  function parsePrice(str) {
    if (!str) return 0;
    return parseFloat(str.replace(/[^0-9.]/g, '')) || 0;
  }

  function formatPrice(str) {
    if (!str) return '';
    const num = parsePrice(str);
    if (num === 0) return str;
    return '$' + Math.round(num).toLocaleString('en-US');
  }

  function getPlaceholderImage() {
    return 'https://via.placeholder.com/316x534/333333/ffffff?text=Card';
  }

  async function getImageFromWorker(itemId) {
    if (!itemId) return getPlaceholderImage();
    try {
      const res = await fetch(`${WORKER_URL}?itemId=${encodeURIComponent(itemId)}`);
      if (!res.ok) return getPlaceholderImage();
      const data = await res.json();
      return data.imageUrl || getPlaceholderImage();
    } catch (e) {
      return getPlaceholderImage();
    }
  }

  async function loadProducts() {
    try {
      const res = await fetch(CSV_URL);
      const text = await res.text();
      const rows = text.trim().split('\n').slice(1);
      const ticker = document.getElementById('ticker');
      const infoBar = document.getElementById('infoBar');

      const items = [];
      let inStockCount = 0;
      let totalValue = 0;

      rows.forEach((row, index) => {
        const cols = parseCSVRow(row);
        const rawPrice = cols[7]?.trim() || '';
        const status = (cols[8]?.trim() || '').toLowerCase();
        const lineNumber = index + 2;
        const ebayItemId = cols[EBAY_ITEM_ID_COLUMN]?.trim() || '';

        if (!rawPrice && !ebayItemId) return;

        const isSoldOut = status === 'sold out';
        const displayPrice = formatPrice(rawPrice);
        let priceHtml = '';
        if (isSoldOut) {
          priceHtml = `<span class="soldout-price">${displayPrice}</span><span class="soldout">sold out</span>`;
        } else if (rawPrice) {
          priceHtml = `<span class="price">${displayPrice}</span>`;
          inStockCount++;
          totalValue += parsePrice(rawPrice);
        }

        items.push({ lineNumber, ebayItemId, priceHtml });
      });

      const imagePromises = items.map(item => getImageFromWorker(item.ebayItemId));
      const images = await Promise.all(imagePromises);

      let html = '';
      items.forEach((item, i) => {
        html += `
          <div class="card-item">
            <img src="${images[i]}" alt="Item ${item.lineNumber}">
            <div class="card-meta">
              <span>${item.lineNumber}</span>
              <span>${item.priceHtml}</span>
            </div>
          </div>
        `;
      });

      ticker.innerHTML = html + html;
      const formattedValue = totalValue.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
      infoBar.textContent = `${inStockCount} ITEMS - ${formattedValue} - CHAT !# TO BUY`;
    } catch (e) {
      console.error(e);
      document.getElementById('infoBar').textContent = 'Error loading inventory';
    }
  }

  loadProducts();
  setInterval(loadProducts, 120000);
</script>
</body>
</html>
