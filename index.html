Comment ! followed by number for link to purchase. Example: !20
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Ticker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    background: transparent;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  .ticker-wrap {
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    color: white;
    overflow: hidden;
    position: relative;
    box-sizing: border-box;
  }
  .ticker {
    display: flex;
    flex-direction: column;
    animation: scroll 300s linear infinite;
    width: 100%;
  }
  .item {
    padding: 8px 16px;
    font-size: 11px;
    font-weight: bold;
    white-space: normal;
    word-break: break-word;
    overflow-wrap: anywhere;
    box-sizing: border-box;
    width: 100%;
  }
  .item span.price {
    color: #4ade80;
    margin-left: 8px;
  }
  .item span.soldout-price {
    color: #ef4444;
    margin-left: 8px;
    text-decoration: line-through;
  }
  .item span.soldout {
    color: #ef4444;
    margin-left: 4px;
    text-transform: uppercase;
  }
  @keyframes scroll {
    0% { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }
</style>
</head>
<body>
<div class="ticker-wrap">
  <div class="ticker" id="ticker"></div>
</div>

<script>
  // Google Sheet published CSV
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQC0oTQEVVzoNRYrTdZ4LU3yRZZCQugnVwj0_sUUJcUDw4l_DbncBWdWIWZxLvRT5b9j5l_9a0LfA2V/pub?gid=866828695&single=true&output=csv';

  // Proper CSV row parser that handles quoted commas
  function parseCSVRow(row) {
    const result = [];
    let current = '';
    let inQuotes = false;

    for (let i = 0; i < row.length; i++) {
      const char = row[i];
      const nextChar = row[i + 1];

      if (char === '"' && inQuotes && nextChar === '"') {
        current += '"';
        i++;
      } else if (char === '"') {
        inQuotes = !inQuotes;
      } else if (char === ',' && !inQuotes) {
        result.push(current);
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current);
    return result;
  }

  async function loadProducts() {
    try {
      const res = await fetch(CSV_URL);
      const text = await res.text();
      const rows = text.trim().split('\n').slice(1); // skip header

      const ticker = document.getElementById('ticker');
      let html = '';

      rows.forEach((row, index) => {
        const cols = parseCSVRow(row);
        // Column C = index 2, Column H = index 7, Column I = index 8
        const name = cols[2]?.trim() || '';
        const price = cols[7]?.trim() || '';
        const status = (cols[8]?.trim() || '').toLowerCase();
        const lineNumber = index + 2; // start at 2 (header is line 1)

        if (name) {
          let extra = '';
          if (status === 'sold out') {
            extra = `<span class="soldout-price">${price}</span><span class="soldout">sold out</span>`;
          } else if (price) {
            extra = `<span class="price">${price}</span>`;
          }
          html += `<div class="item">${lineNumber}. ${name}${extra}</div>`;
        }
      });

      ticker.innerHTML = html + html;
    } catch (e) {
      document.getElementById('ticker').innerHTML = '<div class="item">Error loading products</div>';
    }
  }

  loadProducts();
  setInterval(loadProducts, 120000);
</script>
</body>
</html>
