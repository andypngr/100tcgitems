<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Ticker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    background: transparent;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  .ticker-wrap {
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    color: white;
    overflow: hidden;
    position: relative;
    box-sizing: border-box;
  }
  .ticker {
    display: flex;
    flex-direction: column;
    animation: scroll 300s linear infinite;
    width: 100%;
  }
  .item {
    padding: 8px 16px;
    font-size: 11px;
    font-weight: bold;
    white-space: normal;
    word-break: break-word;
    overflow-wrap: anywhere;
    box-sizing: border-box;
    width: 100%;
  }
  .item span.price {
    color: #4ade80;
    margin-left: 8px;
  }
  @keyframes scroll {
    0% { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }
</style>
</head>
<body>
<div class="ticker-wrap">
  <div class="ticker" id="ticker"></div>
</div>

<script>
  // Google Sheet published CSV
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQC0oTQEVVzoNRYrTdZ4LU3yRZZCQugnVwj0_sUUJcUDw4l_DbncBWdWIWZxLvRT5b9j5l_9a0LfA2V/pub?gid=866828695&single=true&output=csv';

  async function loadProducts() {
    try {
      const res = await fetch(CSV_URL);
      const text = await res.text();
      const rows = text.trim().split('\n').slice(1); // skip header

      const ticker = document.getElementById('ticker');
      let html = '';

      rows.forEach((row, index) => {
        const cols = row.split(',');
        // Column C = index 2, Column H = index 7
        const name = cols[2]?.replace(/"/g, '').trim() || '';
        const price = cols[7]?.replace(/"/g, '').trim() || '';
        const lineNumber = index + 1; // starts at 1
        if (name) {
          html += `<div class="item">${lineNumber}. ${name}${price ? `<span class="price">${price}</span>` : ''}</div>`;
        }
      });

      // Duplicate for seamless loop
      ticker.innerHTML = html + html;
    } catch (e) {
      document.getElementById('ticker').innerHTML = '<div class="item">Error loading products</div>';
    }
  }

  loadProducts();
  // Refresh every 2 minutes
  setInterval(loadProducts, 120000);
</script>
</body>
</html>
```

### What changed
- Everything is explicitly `width: 100%`
- Removed `white-space: nowrap` so text wraps instead of overflowing when the browser gets narrow
- Added `word-break` and `overflow-wrap` so long card names adapt cleanly

It will now shrink and reflow with the browser/embed width.
