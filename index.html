<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card Shop Stream</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }

  .layout {
    display: flex;
    height: 100%;
    width: 100%;
  }

  /* LEFT: Item Feed (1/3) */
  .feed-panel {
    width: 33.333%;
    height: 100%;
    background: #111;
    border-right: 3px solid #333;
    position: relative;
  }

  .info-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    background: #000;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    padding: 8px 10px;
    text-align: center;
    border-bottom: 2px solid #444;
    z-index: 5;
  }

  .ticker-wrap {
    position: absolute;
    top: 36px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    background: #0a0a0a;
  }

  .ticker {
    display: flex;
    flex-direction: column;
    animation: scroll 300s linear infinite;
  }

  .item {
    padding: 6px 10px;
    font-size: 11px;
    font-weight: bold;
    color: #eee;
    border-bottom: 1px solid #222;
  }
  .item span.price { color: #4ade80; margin-left: 6px; }
  .item span.soldout-price { color: #ef4444; margin-left: 6px; text-decoration: line-through; }
  .item span.soldout { color: #ef4444; margin-left: 4px; text-transform: uppercase; }

  @keyframes scroll {
    0% { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }

  /* RIGHT: Shop Scene (2/3) */
  .shop-panel {
    width: 66.667%;
    height: 100%;
    background: #87b8e0;
    position: relative;
    overflow: hidden;
  }

  /* Floor */
  .floor {
    position: absolute;
    inset: 0;
    background: 
      linear-gradient(#5a9fd4 1px, transparent 1px),
      linear-gradient(90deg, #5a9fd4 1px, transparent 1px),
      #6eb5e0;
    background-size: 40px 40px;
  }

  /* Walls (side + back only) */
  .wall-back {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 70px;
    background: #e8e0d0;
    border-bottom: 6px solid #c4b8a0;
  }
  .wall-left {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 20px;
    background: #e8e0d0;
  }
  .wall-right {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 20px;
    background: #e8e0d0;
  }

  /* Cash register counter (back left) */
  .counter {
    position: absolute;
    left: 50px;
    top: 100px;
    width: 180px;
    height: 70px;
    background: #d4c4a8;
    border: 4px solid #a88c6c;
  }
  .register {
    position: absolute;
    left: 60px;
    top: 85px;
    width: 40px;
    height: 25px;
    background: #333;
    border: 2px solid #111;
  }

  /* Glass display cases */
  .case {
    position: absolute;
    background: rgba(200, 230, 255, 0.4);
    border: 3px solid #8ab4d4;
    box-shadow: inset 0 0 8px rgba(255,255,255,0.5);
  }
  .case-1 { left: 260px; top: 120px; width: 140px; height: 60px; }
  .case-2 { left: 420px; top: 120px; width: 140px; height: 60px; }
  .case-3 { left: 580px; top: 120px; width: 140px; height: 60px; }
  .case-4 { left: 340px; top: 220px; width: 160px; height: 70px; }

  /* Card placeholders inside cases */
  .card {
    position: absolute;
    width: 22px;
    height: 30px;
    background: #ff6b6b;
    border: 1px solid #333;
  }
  .case-1 .card:nth-child(1) { left: 15px; top: 15px; background: #ff6b6b; }
  .case-1 .card:nth-child(2) { left: 45px; top: 15px; background: #4ecdc4; }
  .case-1 .card:nth-child(3) { left: 75px; top: 15px; background: #ffe66d; }
  .case-1 .card:nth-child(4) { left: 105px; top: 15px; background: #95e1d3; }

  /* Plants */
  .plant {
    position: absolute;
    width: 30px;
    height: 40px;
    background: #2d6a4f;
    border-radius: 4px 4px 0 0;
  }
  .plant::after {
    content: '';
    position: absolute;
    bottom: -6px; left: 4px; right: 4px;
    height: 8px;
    background: #8b5e3c;
  }
  .plant-1 { left: 40px; top: 200px; }
  .plant-2 { right: 50px; top: 180px; }
  .plant-3 { right: 80px; top: 320px; }

  /* Doormat (centered) */
  .mat {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 30px;
    background: #c0392b;
    border: 2px solid #922b21;
  }
</style>
</head>
<body>
<div class="layout">
  <!-- LEFT FEED -->
  <div class="feed-panel">
    <div class="info-bar" id="infoBar">Loading inventory...</div>
    <div class="ticker-wrap">
      <div class="ticker" id="ticker"></div>
    </div>
  </div>

  <!-- RIGHT SHOP -->
  <div class="shop-panel">
    <div class="floor"></div>
    <div class="wall-back"></div>
    <div class="wall-left"></div>
    <div class="wall-right"></div>

    <div class="counter"></div>
    <div class="register"></div>

    <div class="case case-1">
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
    </div>
    <div class="case case-2"></div>
    <div class="case case-3"></div>
    <div class="case case-4"></div>

    <div class="plant plant-1"></div>
    <div class="plant plant-2"></div>
    <div class="plant plant-3"></div>

    <div class="mat"></div>
  </div>
</div>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQC0oTQEVVzoNRYrTdZ4LU3yRZZCQugnVwj0_sUUJcUDw4l_DbncBWdWIWZxLvRT5b9j5l_9a0LfA2V/pub?gid=866828695&single=true&output=csv';

  function parseCSVRow(row) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < row.length; i++) {
      const char = row[i];
      const nextChar = row[i + 1];
      if (char === '"' && inQuotes && nextChar === '"') { current += '"'; i++; }
      else if (char === '"') { inQuotes = !inQuotes; }
      else if (char === ',' && !inQuotes) { result.push(current); current = ''; }
      else { current += char; }
    }
    result.push(current);
    return result;
  }

  function parsePrice(str) {
    if (!str) return 0;
    return parseFloat(str.replace(/[^0-9.]/g, '')) || 0;
  }

  async function loadProducts() {
    try {
      const res = await fetch(CSV_URL);
      const text = await res.text();
      const rows = text.trim().split('\n').slice(1);
      const ticker = document.getElementById('ticker');
      const infoBar = document.getElementById('infoBar');
      let html = '';
      let inStockCount = 0;
      let totalValue = 0;

      rows.forEach((row, index) => {
        const cols = parseCSVRow(row);
        const name = cols[2]?.trim() || '';
        const price = cols[7]?.trim() || '';
        const status = (cols[8]?.trim() || '').toLowerCase();
        const lineNumber = index + 2;
        if (!name) return;

        const isSoldOut = status === 'sold out';
        let extra = '';
        if (isSoldOut) {
          extra = `<span class="soldout-price">${price}</span><span class="soldout">sold out</span>`;
        } else {
          if (price) extra = `<span class="price">${price}</span>`;
          inStockCount++;
          totalValue += parsePrice(price);
        }
        html += `<div class="item">${lineNumber}. ${name}${extra}</div>`;
      });

      ticker.innerHTML = html + html;
      const formattedValue = totalValue.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
      infoBar.textContent = `${inStockCount} ITEMS - ${formattedValue} - CHAT !# TO BUY`;
    } catch (e) {
      document.getElementById('infoBar').textContent = 'Error loading inventory';
    }
  }

  loadProducts();
  setInterval(loadProducts, 120000);
</script>
</body>
</html>
