<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Ticker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    background: transparent;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  .info-bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(0,0,0,0.85);
    color: white;
    font-size: 13px;
    font-weight: bold;
    padding: 6px 12px;
    text-align: center;
    z-index: 10;
    box-sizing: border-box;
    letter-spacing: 0.5px;
  }
  .ticker-wrap {
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    color: white;
    overflow: hidden;
    position: relative;
    box-sizing: border-box;
    padding-top: 32px; /* space for info bar */
  }
  .ticker {
    display: flex;
    flex-direction: column;
    animation: scroll 300s linear infinite;
    width: 100%;
  }
  .item {
    padding: 8px 16px;
    font-size: 11px;
    font-weight: bold;
    white-space: normal;
    word-break: break-word;
    overflow-wrap: anywhere;
    box-sizing: border-box;
    width: 100%;
  }
  .item span.price {
    color: #4ade80;
    margin-left: 8px;
  }
  .item span.soldout-price {
    color: #ef4444;
    margin-left: 8px;
    text-decoration: line-through;
  }
  .item span.soldout {
    color: #ef4444;
    margin-left: 4px;
    text-transform: uppercase;
  }
  @keyframes scroll {
    0% { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }
</style>
</head>
<body>
<div class="info-bar" id="infoBar">Loading inventory...</div>
<div class="ticker-wrap">
  <div class="ticker" id="ticker"></div>
</div>

<script>
  // Google Sheet published CSV
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQC0oTQEVVzoNRYrTdZ4LU3yRZZCQugnVwj0_sUUJcUDw4l_DbncBWdWIWZxLvRT5b9j5l_9a0LfA2V/pub?gid=866828695&single=true&output=csv';

  // Proper CSV row parser that handles quoted commas
  function parseCSVRow(row) {
    const result = [];
    let current = '';
    let inQuotes = false;

    for (let i = 0; i < row.length; i++) {
      const char = row[i];
      const nextChar = row[i + 1];

      if (char === '"' && inQuotes && nextChar === '"') {
        current += '"';
        i++;
      } else if (char === '"') {
        inQuotes = !inQuotes;
      } else if (char === ',' && !inQuotes) {
        result.push(current);
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current);
    return result;
  }

  // Parse price string into a number (handles $, commas, etc.)
  function parsePrice(str) {
    if (!str) return 0;
    const cleaned = str.replace(/[^0-9.]/g, '');
    return parseFloat(cleaned) || 0;
  }

  async function loadProducts() {
    try {
      const res = await fetch(CSV_URL);
      const text = await res.text();
      const rows = text.trim().split('\n').slice(1); // skip header

      const ticker = document.getElementById('ticker');
      const infoBar = document.getElementById('infoBar');
      let html = '';
      let inStockCount = 0;
      let totalValue = 0;

      rows.forEach((row, index) => {
        const cols = parseCSVRow(row);
        const name = cols[2]?.trim() || '';
        const price = cols[7]?.trim() || '';
        const status = (cols[8]?.trim() || '').toLowerCase();
        const lineNumber = index + 2;

        if (name) {
          const isSoldOut = status === 'sold out';
          let extra = '';

          if (isSoldOut) {
            extra = `<span class="soldout-price">${price}</span><span class="soldout">sold out</span>`;
          } else {
            if (price) extra = `<span class="price">${price}</span>`;
            inStockCount++;
            totalValue += parsePrice(price);
          }

          html += `<div class="item">${lineNumber}. ${name}${extra}</div>`;
        }
      });

      ticker.innerHTML = html + html;

      // Update info bar
      const formattedValue = totalValue.toLocaleString('en-US', {
        style: 'currency',
        currency: 'USD',
        maximumFractionDigits: 0
      });
      infoBar.textContent = `${inStockCount} ITEMS - ${formattedValue} - CHAT !# TO BUY`;

    } catch (e) {
      document.getElementById('ticker').innerHTML = '<div class="item">Error loading products</div>';
      document.getElementById('infoBar').textContent = 'Error loading inventory';
    }
  }

  loadProducts();
  setInterval(loadProducts, 120000);
</script>
</body>
</html>
