<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card Shop Stream</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; font-family: 'Courier New', monospace; overflow: hidden; }

  .layout {
    display: flex;
    height: 100%;
    width: 100%;
  }

  /* LEFT: Item Feed (1/3) */
  .feed-panel {
    width: 33.333%;
    height: 100%;
    background: #1a1a1a;
    border-right: 4px solid #333;
    position: relative;
    overflow: hidden;
  }

  .info-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    background: #111;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    padding: 8px 10px;
    text-align: center;
    letter-spacing: 0.5px;
    border-bottom: 2px solid #444;
    z-index: 5;
  }

  .ticker-wrap {
    position: absolute;
    top: 36px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    background: #0f0f0f;
  }

  .ticker {
    display: flex;
    flex-direction: column;
    animation: scroll 300s linear infinite;
  }

  .item {
    padding: 6px 10px;
    font-size: 11px;
    font-weight: bold;
    color: #eee;
    border-bottom: 1px solid #222;
  }
  .item span.price { color: #4ade80; margin-left: 6px; }
  .item span.soldout-price { color: #ef4444; margin-left: 6px; text-decoration: line-through; }
  .item span.soldout { color: #ef4444; margin-left: 4px; text-transform: uppercase; }

  @keyframes scroll {
    0% { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }

  /* RIGHT: Card Shop Visual (2/3) */
  .shop-panel {
    width: 66.667%;
    height: 100%;
    background: #87ceeb;
    position: relative;
    overflow: hidden;
    image-rendering: pixelated;
  }

  /* Floor tiles */
  .floor {
    position: absolute;
    inset: 0;
    background: 
      linear-gradient(#5a9fd4 1px, transparent 1px),
      linear-gradient(90deg, #5a9fd4 1px, transparent 1px),
      #6eb5e0;
    background-size: 32px 32px;
  }

  /* Walls / upper area */
  .wall {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 80px;
    background: #f5e6c8;
    border-bottom: 6px solid #d4c4a0;
  }

  /* Counter */
  .counter {
    position: absolute;
    left: 40px;
    top: 120px;
    width: 220px;
    height: 90px;
    background: #e8d5b0;
    border: 4px solid #c4a882;
    box-shadow: inset 0 0 0 2px #f0e0c0;
  }
  .counter::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 10px; right: 10px;
    height: 8px;
    background: #b8956a;
  }

  /* Shelves */
  .shelf {
    position: absolute;
    background: #d4b896;
    border: 3px solid #a8845c;
  }
  .shelf-1 { left: 40px; top: 260px; width: 180px; height: 50px; }
  .shelf-2 { left: 40px; top: 340px; width: 180px; height: 50px; }
  .shelf-3 { right: 50px; top: 180px; width: 140px; height: 40px; }
  .shelf-4 { right: 50px; top: 250px; width: 140px; height: 40px; }
  .shelf-5 { right: 50px; top: 320px; width: 140px; height: 40px; }

  /* Item placeholders on shelves (easy to replace with real images later) */
  .item-sprite {
    position: absolute;
    width: 28px;
    height: 28px;
    background: #ff6b6b;
    border: 2px solid #333;
    border-radius: 2px;
  }
  .shelf-1 .item-sprite:nth-child(1) { left: 15px; top: 10px; background: #ff6b6b; }
  .shelf-1 .item-sprite:nth-child(2) { left: 55px; top: 10px; background: #4ecdc4; }
  .shelf-1 .item-sprite:nth-child(3) { left: 95px; top: 10px; background: #ffe66d; }
  .shelf-1 .item-sprite:nth-child(4) { left: 135px; top: 10px; background: #95e1d3; }

  /* Plant */
  .plant {
    position: absolute;
    left: 280px;
    top: 100px;
    width: 36px;
    height: 50px;
    background: #2d6a4f;
    border-radius: 4px 4px 0 0;
  }
  .plant::before {
    content: '';
    position: absolute;
    bottom: -8px; left: 4px; right: 4px;
    height: 10px;
    background: #8b5e3c;
  }

  /* Entrance mat */
  .mat {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 20px;
    background: #c0392b;
    border: 2px solid #922b21;
  }
</style>
</head>
<body>
<div class="layout">
  <!-- LEFT FEED -->
  <div class="feed-panel">
    <div class="info-bar" id="infoBar">Loading inventory...</div>
    <div class="ticker-wrap">
      <div class="ticker" id="ticker"></div>
    </div>
  </div>

  <!-- RIGHT SHOP -->
  <div class="shop-panel">
    <div class="floor"></div>
    <div class="wall"></div>

    <div class="counter"></div>

    <div class="shelf shelf-1">
      <div class="item-sprite"></div>
      <div class="item-sprite"></div>
      <div class="item-sprite"></div>
      <div class="item-sprite"></div>
    </div>
    <div class="shelf shelf-2"></div>
    <div class="shelf shelf-3"></div>
    <div class="shelf shelf-4"></div>
    <div class="shelf shelf-5"></div>

    <div class="plant"></div>
    <div class="mat"></div>
  </div>
</div>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQC0oTQEVVzoNRYrTdZ4LU3yRZZCQugnVwj0_sUUJcUDw4l_DbncBWdWIWZxLvRT5b9j5l_9a0LfA2V/pub?gid=866828695&single=true&output=csv';

  function parseCSVRow(row) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < row.length; i++) {
      const char = row[i];
      const nextChar = row[i + 1];
      if (char === '"' && inQuotes && nextChar === '"') { current += '"'; i++; }
      else if (char === '"') { inQuotes = !inQuotes; }
      else if (char === ',' && !inQuotes) { result.push(current); current = ''; }
      else { current += char; }
    }
    result.push(current);
    return result;
  }

  function parsePrice(str) {
    if (!str) return 0;
    return parseFloat(str.replace(/[^0-9.]/g, '')) || 0;
  }

  async function loadProducts() {
    try {
      const res = await fetch(CSV_URL);
      const text = await res.text();
      const rows = text.trim().split('\n').slice(1);
      const ticker = document.getElementById('ticker');
      const infoBar = document.getElementById('infoBar');
      let html = '';
      let inStockCount = 0;
      let totalValue = 0;

      rows.forEach((row, index) => {
        const cols = parseCSVRow(row);
        const name = cols[2]?.trim() || '';
        const price = cols[7]?.trim() || '';
        const status = (cols[8]?.trim() || '').toLowerCase();
        const lineNumber = index + 2;
        if (!name) return;

        const isSoldOut = status === 'sold out';
        let extra = '';
        if (isSoldOut) {
          extra = `<span class="soldout-price">${price}</span><span class="soldout">sold out</span>`;
        } else {
          if (price) extra = `<span class="price">${price}</span>`;
          inStockCount++;
          totalValue += parsePrice(price);
        }
        html += `<div class="item">${lineNumber}. ${name}${extra}</div>`;
      });

      ticker.innerHTML = html + html;
      const formattedValue = totalValue.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
      infoBar.textContent = `${inStockCount} ITEMS - ${formattedValue} - CHAT !# TO BUY`;
    } catch (e) {
      document.getElementById('infoBar').textContent = 'Error loading inventory';
    }
  }

  loadProducts();
  setInterval(loadProducts, 120000);
</script>
</body>
</html>
